server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Missing build assets must return 404 instead of the app's HTML.
    location /assets/ {
        try_files $uri =404;
    }

    # Serve prerendered pages, falling back to the client-side router.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
